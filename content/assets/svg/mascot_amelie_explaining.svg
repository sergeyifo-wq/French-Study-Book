<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Amelie - French Mascot - Explaining Pose (hand gesture) -->
  
  <!-- Background circle -->
  <circle cx="100" cy="180" r="90" fill="#F5F5DC" stroke="#0055A4" stroke-width="2"/>
  
  <!-- Head and neck -->
  <ellipse cx="100" cy="120" rx="35" ry="40" fill="#FFDAB9" stroke="#8B4513" stroke-width="1.5"/>
  <ellipse cx="100" cy="155" rx="12" ry="15" fill="#FFDAB9" stroke="#8B4513" stroke-width="1.5"/>
  
  <!-- Hair (brown, shoulder-length) -->
  <path d="M65 100 Q80 80 100 85 Q120 80 135 100 Q140 115 135 130 Q120 140 100 140 Q80 140 65 130 Q60 115 65 100 Z" fill="#654321" stroke="#4A3018" stroke-width="1"/>
  <path d="M65 105 Q75 90 100 92 Q125 90 135 105" fill="#654321" stroke="#4A3018" stroke-width="1"/>
  
  <!-- Bangs -->
  <path d="M75 95 Q85 85 100 88 Q115 85 125 95 Q120 100 115 102 Q100 105 85 102 Q80 100 75 95 Z" fill="#654321" stroke="#4A3018" stroke-width="1"/>
  
  <!-- Face details -->
  <!-- Eyes (looking slightly to the side, thinking) -->
  <ellipse cx="85" cy="110" rx="6" ry="8" fill="#2C2C2C"/>
  <ellipse cx="115" cy="110" rx="6" ry="8" fill="#2C2C2C"/>
  <!-- Eyebrows (raised) -->
  <path d="M75 100 Q85 95 95 100" stroke="#4A3018" stroke-width="2" fill="none"/>
  <path d="M105 100 Q115 95 125 100" stroke="#4A3018" stroke-width="2" fill="none"/>
  <!-- Nose -->
  <ellipse cx="100" cy="118" rx="3" ry="4" fill="#E8B8A0"/>
  <!-- Mouth (slight smile, talking) -->
  <path d="M88 128 Q100 133 112 128" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M88 128 Q100 130 112 128" stroke="#8B4513" stroke-width="1" fill="none"/>
  
  <!-- Ears -->
  <ellipse cx="70" cy="115" rx="8" ry="12" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  <ellipse cx="130" cy="115" rx="8" ry="12" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Hair behind ears -->
  <path d="M60 110 Q65 105 70 110 Q75 115 70 120 Q65 115 60 110 Z" fill="#654321"/>
  <path d="M130 110 Q135 105 140 110 Q145 115 140 120 Q135 115 130 110 Z" fill="#654321"/>
  
  <!-- Body -->
  <path d="M80 160 Q100 165 120 160 L120 180 Q100 175 80 180 Z" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Blouse (light blue) -->
  <path d="M80 180 L80 220 Q100 225 120 220 L120 180 Z" fill="#E6F2FF" stroke="#0055A4" stroke-width="1"/>
  <path d="M80 180 Q70 185 70 200 L70 220 Q80 225 80 220" fill="#E6F2FF" stroke="#0055A4" stroke-width="1"/>
  <path d="M120 180 Q130 185 130 200 L130 220 Q120 225 120 220" fill="#E6F2FF" stroke="#0055A4" stroke-width="1"/>
  
  <!-- Scarf (French red) -->
  <path d="M70 190 Q60 195 60 210 L60 220 Q70 225 80 220 L80 210 Q70 205 70 190 Z" fill="#E8112D" stroke="#8B0000" stroke-width="1"/>
  <path d="M130 190 Q140 195 140 210 L140 220 Q130 225 120 220 L120 210 Q130 205 130 190 Z" fill="#E8112D" stroke="#8B0000" stroke-width="1"/>
  <path d="M60 210 L60 240 Q70 245 80 240" fill="#E8112D" stroke="#8B0000" stroke-width="1"/>
  <path d="M140 210 L140 240 Q130 245 120 240" fill="#E8112D" stroke="#8B0000" stroke-width="1"/>
  
  <!-- Arms -->
  <!-- Left arm (raised, explaining) -->
  <path d="M70 185 Q50 175 40 185 Q35 195 40 205 Q50 215 60 210 L70 195 Z" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Right arm (bent at elbow, hand up) -->
  <path d="M130 185 Q150 180 160 190 Q165 200 160 205" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  <path d="M160 205 L165 210 Q170 215 165 220 L160 215 L155 210 L160 205" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Hands -->
  <ellipse cx="38" cy="200" rx="8" ry="5" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  <ellipse cx="163" cy="215" rx="8" ry="5" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Skirt -->
  <path d="M80 220 Q70 225 65 240 L65 280 Q80 290 100 285 Q120 290 135 280 L135 240 Q130 225 120 220" fill="#4A5568" stroke="#2C2C2C" stroke-width="1"/>
  
  <!-- Legs -->
  <path d="M85 280 L85 300 Q80 310 75 305 L75 280" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  <path d="M115 280 L115 300 Q120 310 125 305 L125 280" fill="#FFDAB9" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Shoes -->
  <ellipse cx="80" cy="305" rx="12" ry="6" fill="#2C2C2C" stroke="#000000" stroke-width="1"/>
  <ellipse cx="120" cy="305" rx="12" ry="6" fill="#2C2C2C" stroke="#000000" stroke-width="1"/>
  
  <!-- Shadow -->
  <ellipse cx="100" cy="310" rx="40" ry="8" fill="#000000" opacity="0.2"/>
  
  <!-- Thought bubble -->
  <path d="M140 60 Q150 50 170 55 Q180 50 190 60 Q190 70 180 80 Q170 85 160 80 Q150 85 140 80 Q140 60 140 60 Z" fill="#FFFFFF" stroke="#0055A4" stroke-width="2"/>
  <circle cx="155" cy="70" r="3" fill="#FFFFFF"/>
  <circle cx="165" cy="65" r="3" fill="#FFFFFF"/>
  <circle cx="175" cy="68" r="3" fill="#FFFFFF"/>
  
  <!-- Light bulb (idea) -->
  <path d="M160 60 L162 55 L168 55 L170 60 L172 65 L168 70 L162 70 L160 65 Z" fill="#FFD700" stroke="#8B6914" stroke-width="1"/>
  <path d="M165 55 L165 50" stroke="#8B6914" stroke-width="2" fill="none"/>
  <path d="M162 50 Q165 45 168 50" stroke="#8B6914" stroke-width="1" fill="none"/>
</svg>
